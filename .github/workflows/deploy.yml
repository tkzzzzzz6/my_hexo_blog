name: Deploy Hexo to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - 'themes/**'
      - '_config.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    # Opt in only after source/main and the live site have been reconciled.
    if: github.event_name == 'workflow_dispatch' || vars.SITE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      # hexo-deployer config override removed; we publish via actions-gh-pages

      - name: Build
        run: |
          npm run check:build

      - name: Sanity check build outputs
        run: |
          echo "=== public root ===" && ls -lah public || true
          echo "=== public/static ===" && ls -lah public/static || true
      
      - name: Publish to external repo
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          external_repository: tkzzzzzz6/tkzzzzzz6.github.io
          publish_branch: master
          publish_dir: ./public
          keep_files: false
          force_orphan: false
          enable_jekyll: false
