name: Agent policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to re-evaluate (never bypasses policy)'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: main-delivery-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out the PR head, merge ref, or dispatch-selected branch here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          DISPATCH_PR: ${{ inputs.pr }}
        with:
          script: |
            const numbers = [context.payload.pull_request?.number || Number(process.env.DISPATCH_PR)];
            for (const number of numbers.filter(Boolean)) {
              await require('./tools/agent-flow/controller.cjs')({github, context, core, number});
            }
