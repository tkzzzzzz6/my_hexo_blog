name: Maintainer approval

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number reviewed by the maintainer'
        required: true
        type: number
      sha:
        description: 'Full 40-character PR head SHA reviewed'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: main-delivery-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  approve:
    environment: maintainer-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr }}
          REVIEWED_SHA: ${{ inputs.sha }}
        with:
          script: |
            await require('./tools/agent-flow/approve.cjs')({github, context, core, number: process.env.PR_NUMBER, sha: process.env.REVIEWED_SHA});
